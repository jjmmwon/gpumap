[build-system]
requires = ["scikit-build-core>=0.7", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "gpumap"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build/dev"
wheel.packages = ["python/gpumap"]

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
