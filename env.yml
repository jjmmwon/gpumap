name: gpumap-seq
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # RAPIDS 26.02 officially supports CUDA 12.x; pin to 12.9 to match current env
  - cuda-version=12.9

  # RAPIDS — C++ build deps (rmm, cuvs, raft headers/libs)
  - rmm
  - cuvs
  - pylibraft
  - cupy

  # evaluation scripts only: install separately if needed
  # mamba install -c rapidsai cuml=26.02.* raft-dask=26.02.*

  # C++ / CUDA build tools
  - cmake>=3.26
  - ninja
  - compilers        # includes c-compiler, cxx-compiler, fortran-compiler
  - make
  - ccache

  # Python ↔ C++ binding
  - pybind11
  - pkg-config
  - git
  - fmt              # C++ fmt (RAFT dependency stabilizer)

  # Python dev
  - numpy
  - scipy
  - scikit-learn

  # FastAPI backend
  - fastapi>=0.115.0
  - uvicorn
  - python-multipart
  - websockets

  - ipython
  - pytest

  - pip:
    - scikit-build-core>=0.7
