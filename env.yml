name: gpumap
channels:
  - rapidsai
  - nvidia
  - conda-forge

dependencies:
  # Python
  - python=3.11

  # CUDA (user-space only, driver는 host)
  - cuda-version=12.9

  # CuPy (conda 패키지)
  - cupy

  # RAPIDS core
  - rmm
  - cuvs
  - pylibraft
  - raft-dask

  # C++ / CUDA build tools
  - cmake>=3.26
  - ninja
  - compilers          # gcc/g++
  - cxx-compiler
  - make

  # Python ↔ C++ binding
  - pybind11

  # Common dev utilities
  - pkg-config
  - git
  - fmt                # C++ fmt (RAFT 의존성 안정화용)

  # Python-side dev
  - numpy
  - scipy
  - scikit-learn

  # optional (있으면 편한 것들)
  - ipython
  - pytest
