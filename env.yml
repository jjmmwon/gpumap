name: gpumap
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Pin CUDA to 12.6 — driver supports up to 13.0 but toolkit must stay ≤13.0
  # to avoid cudaErrorUnsupportedPtxVersion at runtime.
  - cuda-version=12.6

  # CUDA core headers required by cmake (CUDAToolkit → CUDA::cudart)
  - cuda-cccl

  # RAPIDS — C++ build deps (rmm, cuvs, raft headers/libs)
  - rmm=26.02.*
  - cuvs=26.02.*
  - pylibraft=26.02.*
  - cupy
  - cuml=26.02.*

  # C++ / CUDA build tools
  - cmake>=3.26
  - ninja
  - compilers        # includes c-compiler, cxx-compiler, fortran-compiler
  - make
  - ccache

  # Python ↔ C++ binding
  - pybind11
  - pkg-config
  - git
  - fmt              # C++ fmt (RAFT dependency stabilizer)

  # Python dev
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - ipykernel
  - jupyterlab

  # FastAPI backend
  - fastapi>=0.115.0
  - uvicorn
  - python-multipart
  - websockets

  - ipython
  - pytest

  - pip:
    - scikit-build-core>=0.7
