name: gpumap
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # CUDA toolkit (RAPIDS 공식 지원 버전으로 고정)
  # 12.9는 RAPIDS 지원 불안정 → 12.6 사용
  - cuda-version=12.6

  # RAPIDS — 같은 릴리즈에서 한꺼번에 resolve해야 cublas 충돌 없음
  - cuml=26.02.*
  - rmm=26.02.*
  - cuvs=26.02.*
  - pylibraft=26.02.*
  - raft-dask=26.02.*
  - cupy

  # C++ / CUDA build tools
  - cmake>=3.26
  - ninja
  - compilers          # gcc/g++
  - cxx-compiler
  - make

  # Python ↔ C++ binding
  - pybind11

  # Common dev utilities
  - pkg-config
  - git
  - fmt                # C++ fmt (RAFT 의존성 안정화용)

  # Python-side dev
  - numpy
  - scipy
  - scikit-learn

  # gpumap-viz backend (FastAPI)
  - fastapi>=0.115.0
  - uvicorn
  - python-multipart
  - websockets

  # optional
  - ipython
  - pytest
